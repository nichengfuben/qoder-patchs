[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patcher"
version = "2.5.1"
description = "Patcher：Cursor/Qoder CLI 补丁管理，移除 Win10 警告、Cursor Agent auth 热更新与 /sc 便携换号"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "nichengfuben" },
]
keywords = ["cli", "patch", "qoder", "cursor-agent", "sc", "windows", "linux", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "platformdirs>=4.0.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
patcher = "cli.app:typer_app"
agentcli-patchs = "cli.app:typer_app"
acp = "cli.app:typer_app"
qp = "cli.app:typer_app"
sc = "sc.cli:main"

[project.entry-points."patches"]
remove-qoder-warning = "patches.removeqoder_warning:RemoveQoderWarningPatch"
cursor-agent = "patches.cursor.cursor_agent:CursorAgentPatch"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/core", "src/patches", "src/sc", "src/utils"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.8"
strict = true
warn_return_any = true
warn_unused_configs = true
