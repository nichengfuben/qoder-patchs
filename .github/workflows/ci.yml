name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "echotools[console]" tree-sitter
          python -c "import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)" \
            && pip install tree-sitter-language-pack \
            || echo "skip tree-sitter-language-pack on Python < 3.10"

      - name: Pytest
        run: python -m pytest test -q

      - name: Achecker
        run: python achecker.py

  test-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.8", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "echotools[console]" tree-sitter
          python -c "import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)" \
            && pip install tree-sitter-language-pack \
            || echo "skip tree-sitter-language-pack on Python < 3.10"

      - name: Pytest
        run: python -m pytest test -q

      - name: Achecker
        run: python achecker.py
