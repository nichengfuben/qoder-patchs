name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel
        run: python -m build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(python -c "
          from pathlib import Path
          import os
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          ver = os.environ['GITHUB_REF_NAME'].lstrip('v')
          lines = text.splitlines()
          out = []
          capture = False
          for line in lines:
              if line.startswith('## '):
                  if capture:
                      break
                  if ver in line:
                      capture = True
                      continue
              elif capture:
                  out.append(line)
          print('\\n'.join(out).strip() or ('Release ' + ver))
          ")"
          gh release create "$TAG" dist/* \
            --title "Patcher ${TAG}" \
            --notes "$NOTES"
